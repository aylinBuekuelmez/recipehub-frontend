<div class="rh-auth-wrapper">
  <div class="rh-auth-card">
    <div class="rh-auth-icon">🍳</div>
    <h1 class="rh-auth-title">Konto erstellen</h1>
    <p class="rh-auth-sub">Tritt der RecipeHub-Community bei</p>

    <form [formGroup]="registerForm" (ngSubmit)="register()">
      <div class="mb-3">
        <label for="username" class="form-label">Benutzername</label>
        <input
          id="username"
          type="text"
          class="form-control"
          formControlName="username"
          placeholder="Wähle einen Benutzernamen" />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Passwort</label>
        <input
          id="password"
          type="password"
          class="form-control"
          formControlName="password"
          placeholder="Wähle ein Passwort" />
      </div>

      @if(errorMessage) {
        <div class="alert alert-danger py-2">{{ errorMessage }}</div>
      }

      @if(successMessage) {
        <div class="alert alert-success py-2">{{ successMessage }}</div>
      }

      <button
        type="submit"
        class="btn btn-primary w-100 mt-1"
        style="padding: 0.6rem; font-size: 1rem;"
        [disabled]="registerForm.invalid">
        Registrieren
      </button>
    </form>

    <div class="rh-auth-footer">
      Schon ein Konto? <a routerLink="/login">Jetzt anmelden</a>
    </div>
  </div>
</div>
