@if(errorMessage) {
  <div class="alert alert-danger">{{ errorMessage }}</div>
}

@if(recipe) {
  <div class="row justify-content-center">
    <div class="col-12 col-md-9 col-lg-7">

      <div class="mb-3">
        <a routerLink="/recipes" class="rh-back-link">
          <i class="bi bi-arrow-left"></i> Zurück zur Übersicht
        </a>
      </div>

      <div class="rh-detail-card">

        @if(recipe.image_url) {
          <div class="rh-detail-img">
            <img [src]="recipe.image_url" [alt]="recipe.title" />
          </div>
        } @else {
          <div class="rh-detail-img-placeholder">🍴</div>
        }

        <div class="rh-detail-body">
          <div class="rh-detail-meta">
            @if(category) {
              <span class="badge bg-secondary">{{ category.name }}</span>
            }
          </div>

          <h1 class="rh-detail-title">{{ recipe.title }}</h1>

          <div class="rh-detail-section">
            <h5 class="rh-section-label">📝 Beschreibung</h5>
            <p class="rh-section-text">{{ recipe.description }}</p>
          </div>

          <div class="rh-detail-section">
            <h5 class="rh-section-label">🛒 Zutaten</h5>
            <p class="rh-section-text">{{ recipe.ingredients }}</p>
          </div>

          @if(canEdit()) {
            <div class="rh-detail-actions">
              <a [routerLink]="['/recipes', recipe.id, 'edit']" class="btn btn-outline-primary">
                <i class="bi bi-pencil me-1"></i> Bearbeiten
              </a>
              <button class="btn btn-outline-danger" (click)="deleteRecipe()">
                <i class="bi bi-trash me-1"></i> Löschen
              </button>
            </div>
          }
        </div>

      </div>

    </div>
  </div>
}
