@if(errorMessage) {
    <div class="alert alert-danger">{{ errorMessage }}</div>
}

@if(recipe) {
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <div class="mb-3">
                <a routerLink="/recipes" class="btn btn-outline-secondary btn-sm">
                    ← Zurück zur Übersicht
                </a>
            </div>

            <div class="card">
                <div class="card-body">
                    <h1 class="card-title mb-1">{{ recipe.title }}</h1>

                    @if(category) {
                        <span class="badge bg-secondary mb-3">{{ category.name }}</span>
                    }

                    <h5 class="mt-3">Beschreibung</h5>
                    <p class="card-text">{{ recipe.description }}</p>

                    <h5 class="mt-3">Zutaten</h5>
                    <p class="card-text">{{ recipe.ingredients }}</p>
                </div>

                @if(canEdit()) {
                    <div class="card-footer d-flex gap-2">
                        <a
                            [routerLink]="['/recipes', recipe.id, 'edit']"
                            class="btn btn-outline-primary btn-sm">
                            Bearbeiten
                        </a>
                        <button
                            class="btn btn-outline-danger btn-sm"
                            (click)="deleteRecipe()">
                            Löschen
                        </button>
                    </div>
                }
            </div>

        </div>
    </div>
}
